repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/RobertCraiworthy/pyright-python
    rev: v1.1.396
    hooks:
      - id: pyright
        additional_dependencies: []

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest tests/ -x --tb=short -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
