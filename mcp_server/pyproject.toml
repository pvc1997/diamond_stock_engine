[project]
name = "diamond-mcp-server"
version = "0.1.0"
description = "MCP server for Diamond Stock Engine"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0",
    "yfinance>=0.2.66",
    "numpy>=1.21",
    "pandas>=1.5",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "google-generativeai>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
